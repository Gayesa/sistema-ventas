<div class="min-h-screen bg-slate-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8 font-sans">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center">
      <div class="w-32 h-32 bg-primary/5 rounded-3xl flex items-center justify-center p-3">
        <img src="/assets/images/logo-mercurio.png" alt="MERCURIO Logo" class="w-full h-full object-contain drop-shadow-sm">
      </div>
    </div>
    <h2 class="mt-6 text-center text-3xl font-extrabold text-textMain tracking-tight">
      MERCURIO
    </h2>
    <p class="mt-2 text-center text-sm text-textSecondary">
      Ingresa tus credenciales para continuar
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow-soft sm:rounded-2xl sm:px-10 border border-slate-100">
      <form class="space-y-6" (ngSubmit)="onSubmit()">
        
        <div *ngIf="error" class="bg-red-50 text-red-600 p-3 rounded-lg text-sm border border-red-100 flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          {{ error }}
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-textMain">
            Correo electrónico
          </label>
          <div class="mt-1">
            <input id="email" name="email" type="email" autocomplete="email" required [(ngModel)]="email" class="appearance-none block w-full px-4 py-3 border border-slate-200 rounded-xl shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all sm:text-sm bg-slate-50" placeholder="admin@erp.com / caja@erp.com">
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-textMain">
            Contraseña
          </label>
          <div class="mt-1">
            <input id="password" name="password" type="password" autocomplete="current-password" required [(ngModel)]="pass" class="appearance-none block w-full px-4 py-3 border border-slate-200 rounded-xl shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all sm:text-sm bg-slate-50" placeholder="admin / caja">
          </div>
        </div>

        <div>
          <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-primary hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all transform hover:-translate-y-0.5">
            Iniciar Sesión
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
