<div class="h-screen w-full flex bg-background font-sans overflow-hidden">
  <!-- Sidebar -->
  <div [class.w-64]="!isSidebarCollapsed" [class.w-20]="isSidebarCollapsed" class="bg-surface shadow-soft border-r border-slate-200 transition-all duration-300 flex flex-col z-20">
    <div class="h-16 flex items-center justify-between px-4 border-b border-slate-100">
      <div class="flex items-center gap-3 overflow-hidden" *ngIf="!isSidebarCollapsed">
        <img *ngIf="companyLogo" [src]="companyLogo" class="w-8 h-8 rounded-lg object-contain" alt="Logo" />
        <div *ngIf="!companyLogo" class="w-8 h-8 rounded-lg bg-primary/10 flex items-center justify-center text-primary font-bold">
          E
        </div>
        <span class="font-bold text-textMain whitespace-nowrap truncate">{{ companyName }}</span>
      </div>
      <button (click)="toggleSidebar()" class="p-1.5 rounded-lg text-textSecondary hover:bg-slate-100 transition-colors mx-auto">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 py-6 px-3 space-y-1 overflow-y-auto">
      <a routerLink="/admin/dashboard" routerLinkActive="active-nav-link" [routerLinkActiveOptions]="{exact: true}" class="flex items-center px-3 py-2.5 rounded-xl text-textSecondary hover:bg-slate-50 hover:text-textMain font-medium group transition-colors">
        <svg class="h-5 w-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        <span *ngIf="!isSidebarCollapsed">Dashboard</span>
      </a>
      <a *ngIf="userRole === 'SUPER_ADMIN'" routerLink="/admin/superadmin/empresas" routerLinkActive="active-nav-link" class="flex items-center px-3 py-2.5 rounded-xl text-textSecondary hover:bg-slate-50 hover:text-textMain font-medium group transition-colors">
        <svg class="h-5 w-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
        <span *ngIf="!isSidebarCollapsed">Inquilinos (SaaS)</span>
      </a>
      <a *ngIf="userRole === 'ADMIN_TIENDA'" routerLink="/admin/mi-empresa" routerLinkActive="active-nav-link" class="flex items-center px-3 py-2.5 rounded-xl text-textSecondary hover:bg-slate-50 hover:text-textMain font-medium group transition-colors">
        <svg class="h-5 w-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
        <span *ngIf="!isSidebarCollapsed">Mi Empresa</span>
      </a>
      <a *ngIf="userRole === 'ADMIN_TIENDA'" routerLink="/admin/productos" routerLinkActive="active-nav-link" class="flex items-center px-3 py-2.5 rounded-xl text-textSecondary hover:bg-slate-50 hover:text-textMain font-medium group transition-colors">
        <svg class="h-5 w-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
        <span *ngIf="!isSidebarCollapsed">Productos</span>
      </a>
      <a *ngIf="userRole === 'ADMIN_TIENDA'" routerLink="/admin/proveedores" routerLinkActive="active-nav-link" class="flex items-center px-3 py-2.5 rounded-xl text-textSecondary hover:bg-slate-50 hover:text-textMain font-medium group transition-colors">
        <svg class="h-5 w-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        <span *ngIf="!isSidebarCollapsed">Proveedores</span>
      </a>
      <a *ngIf="userRole === 'ADMIN_TIENDA'" routerLink="/admin/vendedores" routerLinkActive="active-nav-link" class="flex items-center px-3 py-2.5 rounded-xl text-textSecondary hover:bg-slate-50 hover:text-textMain font-medium group transition-colors">
        <svg class="h-5 w-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        <span *ngIf="!isSidebarCollapsed">Vendedores</span>
      </a>
      <a *ngIf="userRole === 'ADMIN_TIENDA'" routerLink="/admin/ingreso" routerLinkActive="active-nav-link" class="flex items-center px-3 py-2.5 rounded-xl text-textSecondary hover:bg-slate-50 hover:text-textMain font-medium group transition-colors">
        <svg class="h-5 w-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        <span *ngIf="!isSidebarCollapsed">Ingreso Inventario</span>
      </a>
      <a *ngIf="userRole === 'ADMIN_TIENDA'" routerLink="/admin/historial-compras" routerLinkActive="active-nav-link" class="flex items-center px-3 py-2.5 rounded-xl text-textSecondary hover:bg-slate-50 hover:text-textMain font-medium group transition-colors">
        <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span *ngIf="!isSidebarCollapsed">Historial Compras</span>
      </a>
      <a *ngIf="userRole === 'ADMIN_TIENDA'" (click)="checkRefresh($event, '/admin/historial-ventas')" routerLink="/admin/historial-ventas" routerLinkActive="active-nav-link" class="flex items-center px-3 py-2.5 rounded-xl text-textSecondary hover:bg-slate-50 hover:text-textMain font-medium group transition-colors">
        <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
        <span *ngIf="!isSidebarCollapsed">Historial Ventas</span>
      </a>
      <a *ngIf="userRole === 'ADMIN_TIENDA'" (click)="checkRefresh($event, '/admin/inventario-general')" routerLink="/admin/inventario-general" routerLinkActive="active-nav-link" class="flex items-center px-3 py-2.5 rounded-xl text-textSecondary hover:bg-slate-50 hover:text-textMain font-medium group transition-colors">
        <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
        <span *ngIf="!isSidebarCollapsed">Inventario General</span>
      </a>
      <a *ngIf="userRole === 'ADMIN_TIENDA'" routerLink="/admin/categorias" routerLinkActive="active-nav-link" class="flex items-center px-3 py-2.5 rounded-xl text-textSecondary hover:bg-slate-50 hover:text-textMain font-medium group transition-colors">
        <svg class="h-5 w-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
        <span *ngIf="!isSidebarCollapsed">Categorías</span>
      </a>
      <a *ngIf="userRole === 'ADMIN_TIENDA'" routerLink="/pos/caja" class="flex items-center px-3 py-2.5 rounded-xl text-textSecondary hover:bg-slate-50 hover:text-textMain font-medium group transition-colors">
        <svg class="h-5 w-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        <span *ngIf="!isSidebarCollapsed">Caja / POS</span>
      </a>
      <a *ngIf="userRole === 'SUPER_ADMIN'" routerLink="/admin/reportes-superadmin" routerLinkActive="active-nav-link" class="flex items-center px-3 py-2.5 rounded-xl text-textSecondary hover:bg-slate-50 hover:text-textMain font-medium group transition-colors">
        <svg class="h-5 w-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
        <span *ngIf="!isSidebarCollapsed">Reportes Globales</span>
      </a>
      <a *ngIf="userRole === 'ADMIN_TIENDA'" routerLink="/admin/reportes-empresa" routerLinkActive="active-nav-link" class="flex items-center px-3 py-2.5 rounded-xl text-textSecondary hover:bg-slate-50 hover:text-textMain font-medium group transition-colors">
        <svg class="h-5 w-5 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
        <span *ngIf="!isSidebarCollapsed">Reportes Empresa</span>
      </a>
    </nav>
  </div>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- Header -->
    <header class="h-16 bg-surface shadow-sm border-b border-slate-200 flex items-center justify-between px-6 z-10">
      <div class="flex items-center">
        <!-- Espacio reservado si se requiere algún título o breadcrumb en el futuro -->
      </div>
      
      <div class="flex items-center gap-4">
        <div class="text-right hidden sm:block">
          <p class="text-sm font-semibold text-textMain leading-none">{{ adminName }}</p>
          <p class="text-xs text-textSecondary mt-1">Administrador</p>
        </div>
        <div class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-textMain border border-slate-200">
          A
        </div>
        <button (click)="logout()" class="ml-2 p-2 text-textSecondary hover:text-red-500 transition-colors rounded-lg hover:bg-red-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        </button>
      </div>
    </header>

    <!-- Page Content (Mi Empresa Module Example) -->
    <main class="flex-1 overflow-y-auto p-6 md:p-8 bg-background">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
