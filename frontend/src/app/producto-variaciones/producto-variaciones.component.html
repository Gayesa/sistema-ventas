<div class="producto-variaciones-container">
  <h2>Crear Producto con Variaciones</h2>
  
  <form [formGroup]="productoForm">
    <!-- Información General del Producto -->
    <div style="margin-bottom: 20px;">
      <label>Nombre del Producto:</label>
      <input type="text" formControlName="nombre" placeholder="Ej. Camiseta Polo">
    </div>

    <!-- Sección 1: Definir Atributos -->
    <fieldset>
      <legend>Definir Atributos (Tallas, Colores, etc.)</legend>
      
      <div formArrayName="atributos">
        <div *ngFor="let attr of atributos.controls; let i = index" [formGroupName]="i" class="atributo-row" style="margin-bottom: 10px; display: flex; gap: 10px;">
          
          <input type="text" formControlName="nombre" placeholder="Nombre (Ej. Talla, Color)">
          
          <input type="text" formControlName="valoresText" placeholder="Valores separados por coma (Ej. S,M,L,XL)">
          
          <button type="button" (click)="removerAtributo(i)" class="btn-danger">Quitar</button>
        </div>
      </div>
      
      <div style="margin-top: 15px;">
        <button type="button" (click)="agregarAtributo()" class="btn-secondary">+ Agregar Atributo</button>
        <button type="button" (click)="generarMatriz()" class="btn-primary" style="margin-left: 10px;">Generar Variantes (Matriz)</button>
      </div>
    </fieldset>

    <hr style="margin: 30px 0;">

    <!-- Sección 2: Matriz de Variantes -->
    <fieldset *ngIf="variantes.controls.length > 0">
      <legend>Matriz de Variantes</legend>
      
      <table style="width: 100%; text-align: left; border-collapse: collapse;">
        <thead>
          <tr style="background-color: #f3f4f6; border-bottom: 1px solid #d1d5db;">
            <th style="padding: 10px;">Combinación</th>
            <th style="padding: 10px;">SKU (Requerido)</th>
            <th style="padding: 10px;">Precio Venta</th>
            <th style="padding: 10px;">Stock Inicial</th>
            <th style="padding: 10px;">Acción</th>
          </tr>
        </thead>
        
        <tbody formArrayName="variantes">
          <tr *ngFor="let variante of variantes.controls; let i = index" [formGroupName]="i" style="border-bottom: 1px solid #e5e7eb;">
            
            <!-- Label Visual de la Combinación (Ej: M - Rojo) -->
            <td style="padding: 10px; font-weight: bold;">
              {{ variante.get('_label')?.value }}
            </td>
            
            <!-- Inputs del FormGroup de cada Variante -->
            <td style="padding: 10px;">
              <input type="text" formControlName="sku" placeholder="Ej. POLO-M-ROJ">
            </td>
            
            <td style="padding: 10px;">
              <input type="number" formControlName="precio_venta" placeholder="0.00">
            </td>
            
            <td style="padding: 10px;">
              <input type="number" formControlName="stock" placeholder="0">
            </td>
            
            <td style="padding: 10px;">
              <button type="button" (click)="removerVariante(i)" class="btn-danger">Eliminar fila</button>
            </td>
            
          </tr>
        </tbody>
      </table>
    </fieldset>
    
    <div style="margin-top: 20px; text-align: right;">
      <button type="submit" [disabled]="productoForm.invalid" class="btn-success">Guardar Todo el Producto</button>
    </div>

  </form>
</div>
